version: '3.8'

services:
  nextapp:
    image: ${IMAGE_NAME:-personal-website}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3003}:3003"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      replicas: ${REPLICAS:-1}
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    networks:
      - web_network

  dev:
    image: ${IMAGE_NAME:-personal-website}-dev:${IMAGE_TAG:-latest}
    build:
      context: .
      target: builder
    ports:
      - "${DEV_PORT:-3003}:3003"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3003
    command: npm run dev
    networks:
      - web_network

networks:
  web_network:
    driver: bridge
